name: Mobile

# Checks for the Expo app in apps/mobile. Runs only when the app, its docs or this workflow change.
# It never builds signed binaries and never publishes: see mobile-release.yml and docs/mobile/release.md.

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'docs/mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/mobile/**', 'docs/mobile/**', '.github/workflows/mobile.yml']

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  checks:
    name: Lint, typecheck, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - name: Expo config is valid
        run: npx expo config --type public > /dev/null

  web-smoke:
    name: Web export smoke test (demo mode)
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run export:web
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:web
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: mobile-web-smoke
          path: |
            apps/mobile/playwright-report
            apps/mobile/test-results
          retention-days: 7
