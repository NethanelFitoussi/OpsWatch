name: Mobile release build

# Manual only. Builds store binaries on EAS; it does NOT submit them to the App Store or Google Play.
# Requires the EXPO_TOKEN repository secret and an initialised EAS project (docs/mobile/expo-eas.md).
# Signing credentials stay in EAS; none are stored in this repository or in GitHub.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run check
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build (no submission)
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
