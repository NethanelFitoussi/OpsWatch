name: opswatch-test

services:
  moto:
    image: motoserver/moto:5.2.3
    ports:
      - "5055:5000"

  opswatch:
    build: .
    image: opswatch:test
    depends_on:
      - moto
    ports:
      - "3100:3000"
    environment:
      OPSWATCH_SECRET: test-secret-0123456789abcdef0123456789abcdef
      OPSWATCH_DATA_DIR: /data
      OPSWATCH_AWS_ENDPOINT_URL: http://moto:5000
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_REGION: us-east-1
      # Dummy Google client: enough to show the button and build the redirect, never used to sign in.
      OPSWATCH_PUBLIC_URL: http://localhost:3100
      OPSWATCH_GOOGLE_CLIENT_ID: test-client
      OPSWATCH_GOOGLE_CLIENT_SECRET: test-secret
    tmpfs:
      - /data:uid=1001,gid=1001
