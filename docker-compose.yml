services:
  opswatch:
    build: .
    image: opswatch:local
    restart: unless-stopped
    ports:
      # Reachable from this machine only. To expose OpsWatch, create the admin account first,
      # then put it behind an HTTPS reverse proxy and set OPSWATCH_PUBLIC_URL (see README).
      - "127.0.0.1:3000:3000"
    env_file: .env
    volumes:
      - opswatch-data:/data
      # Optional: use a local AWS profile as OpsWatch's identity (set AWS_PROFILE in .env).
      # - ${HOME}/.aws:/home/opswatch/.aws:ro

volumes:
  opswatch-data:
