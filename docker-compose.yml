services:
  opswatch:
    build:
      context: .
      args:
        # Read from .env: Server Actions only accept the public host the image was built with.
        OPSWATCH_PUBLIC_URL: ${OPSWATCH_PUBLIC_URL:-}
    image: opswatch:local
    restart: unless-stopped
    ports:
      # Reachable from this machine only. To expose OpsWatch, create the admin account first,
      # then put it behind an HTTPS reverse proxy and set OPSWATCH_PUBLIC_URL (see README).
      - "127.0.0.1:3000:3000"
    env_file: .env
    volumes:
      - opswatch-data:/data
    # OpsWatch's own AWS identity: put AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in .env.
    # AWS_PROFILE with a mounted ~/.aws is meant for `npm run dev`: this container runs as uid 1001
    # and usually cannot read a host ~/.aws/credentials file (mode 600), and SSO profiles also need
    # a writable cache.

volumes:
  opswatch-data:
